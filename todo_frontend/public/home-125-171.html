<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Fixed viewport width to preserve pixel-accuracy when opened standalone -->
    <meta name="viewport" content="width=414, initial-scale=1" />
    <title>Home Screen (125:171)</title>

    <!-- Nunito is the primary typeface used by this design system -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/home-125-171.css" />
  </head>

  <body>
    <main class="screen screen-125-171" aria-label="Home Screen">
      <!-- Root frame: 414×1100 -->
      <section class="artboard" role="img" aria-label="Notes home screen">
        <!-- Notes title (125:186) -->
        <h1 class="heroTitle">Notes</h1>

        <!-- Search button background (125:189) -->
        <button class="iconButton iconButton--search" type="button" aria-label="Search" data-action="search">
          <!-- Search icon instance (125:190) -->
          <img
            class="iconButton__icon"
            src="/assets/figma_image_125_190_8_12.svg"
            alt=""
            aria-hidden="true"
            draggable="false"
          />
        </button>

        <!-- Info button (125:187) -->
        <button class="iconButton iconButton--info" type="button" aria-label="Info" data-action="info">
          <img
            class="iconButton__icon"
            src="/assets/figma_image_125_188_8_9.svg"
            alt=""
            aria-hidden="true"
            draggable="false"
          />
        </button>

        <!-- Note cards -->
        <article class="noteCard noteCard--pink" aria-label="Note: Book Review" tabindex="0">
          <div class="noteCard__bg" aria-hidden="true"></div>
          <p class="noteCard__text">Book Review : The Design of Everyday Things by Don Norman</p>
        </article>

        <article class="noteCard noteCard--green" aria-label="Note: Animes produced by Ufotable" tabindex="0">
          <div class="noteCard__bg" aria-hidden="true"></div>
          <p class="noteCard__text">Animes produced by Ufotable</p>
        </article>

        <article class="noteCard noteCard--yellow" aria-label="Note: Mangas planned to read" tabindex="0">
          <div class="noteCard__bg" aria-hidden="true"></div>
          <p class="noteCard__text">Mangas planned to read</p>
        </article>

        <article class="noteCard noteCard--cyan" aria-label="Note: Awesome tweets collection" tabindex="0">
          <div class="noteCard__bg" aria-hidden="true"></div>
          <p class="noteCard__text">Awesome tweets collection</p>
        </article>

        <article class="noteCard noteCard--purple" aria-label="Note: List of free & open source apps" tabindex="0">
          <div class="noteCard__bg" aria-hidden="true"></div>
          <p class="noteCard__text">List of free &amp; open source apps</p>
        </article>

        <!-- Floating action button -->
        <button class="fab" type="button" aria-label="Add note" data-action="add">
          <div class="fab__circle" aria-hidden="true"></div>
          <img class="fab__icon" src="/assets/figma_image_125_192_115_19.svg" alt="" aria-hidden="true" draggable="false" />
        </button>

        <!-- Embed full instance exports listed in YAML (may be used for verification; visually hidden) -->
        <div class="srOnly" aria-hidden="true">
          <img src="/assets/figma_image_125_187.svg" alt="" />
          <img src="/assets/figma_image_125_188.svg" alt="" />
          <img src="/assets/figma_image_125_190.svg" alt="" />
          <img src="/assets/figma_image_125_192.svg" alt="" />
        </div>
      </section>
    </main>

    <script src="/home-125-171.js"></script>
  </body>
</html>
